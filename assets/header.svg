    <text x="600" y="120">    const int* __restrict__ col,</text>
    <text x="600" y="144">    int* girth)</text>
    <text x="600" y="168">{ atomicMin(girth, d + 1); }</text>
  </g>
  <text x="56" y="118" class="name" fill="url(#g)">刘小聪 <tspan fill="#c0caf5" font-weight="300">/</tspan> Liu Cong</text>
  <text x="58" y="152" class="sub">math major → computer science · 山东大学（威海）</text>
  <g class="tag" transform="translate(56,184)">
    <rect width="72" height="26" rx="13" fill="#7aa2f7" fill-opacity="0.14" stroke="#7aa2f7" stroke-opacity="0.5"/>
    <text x="36" y="17.5" text-anchor="middle" fill="#7aa2f7">CUDA</text>
    <rect x="82" width="88" height="26" rx="13" fill="#bb9af7" fill-opacity="0.14" stroke="#bb9af7" stroke-opacity="0.5"/>
    <text x="126" y="17.5" text-anchor="middle" fill="#bb9af7">LLM · RAG</text>
    <rect x="180" width="90" height="26" rx="13" fill="#7dcfff" fill-opacity="0.14" stroke="#7dcfff" stroke-opacity="0.5"/>
    <text x="225" y="17.5" text-anchor="middle" fill="#7dcfff">AI Agents</text>
    <rect x="280" width="60" height="26" rx="13" fill="#ff9e64" fill-opacity="0.14" stroke="#ff9e64" stroke-opacity="0.5"/>
    <text x="310" y="17.5" text-anchor="middle" fill="#ff9e64">HPC</text>
  </g>
  <rect x="0" y="256" width="900" height="4" fill="url(#g)"/>
</g>
<rect x="0.5" y="0.5" width="899" height="259" rx="16" fill="none" stroke="#2f3549"/>
