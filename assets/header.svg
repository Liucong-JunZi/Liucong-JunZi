<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#7aa2f7"/><stop offset="0.55" stop-color="#bb9af7"/><stop offset="1" stop-color="#ff9e64"/>
</linearGradient>
<radialGradient id="glow1" cx="0.85" cy="0.1" r="0.6">
  <stop offset="0" stop-color="#bb9af7" stop-opacity="0.35"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glow2" cx="0.1" cy="0.95" r="0.6">
  <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.30"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
</radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
  <path d="M28 0H0V28" fill="none" stroke="#c0caf5" stroke-opacity="0.045" stroke-width="1"/>
</pattern>
<clipPath id="r"><rect width="900" height="260" rx="16"/></clipPath>
<style>
  .name{font:700 46px -apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;letter-spacing:1px}
  .sub{font:400 15px 'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,monospace;fill:#565f89}
  .tag{font:500 13px 'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,monospace}
</style></defs>

<g clip-path="url(#r)">
  <rect width="900" height="260" fill="#1a1b26"/>
