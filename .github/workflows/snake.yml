name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake svg (Nord palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%235E81AC&color_dots=%23ECEFF4,%23D8DEE9,%23A3BE8C,%2381A1C1,%235E81AC
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2388C0D0&color_dots=%232E3440,%233B4252,%234C566A,%2381A1C1,%2388C0D0

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
