name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake svg (Tokyo Night palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff9e64&color_dots=%23e9ebf3,%23a9b1d6,%237aa2f7,%23bb9af7,%233d59a1
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff9e64&color_dots=%2324283b,%233d59a1,%237aa2f7,%23bb9af7,%23c0caf5

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
